<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砚墨成诗 · 迷你GPT写诗机</title>
<style>
  :root {
    --bg-page: #f5f2e9;
    --paper-card: #fdfbf7;
    --paper-card-subtle: #f9f5ec;
    --ink-primary: #262421;
    --ink-secondary: #5e5951;
    --ink-muted: #8c857b;
    --line-border: #e6dfce;
    --line-border-strong: #d4c8b2;
    --pine-green: #1a5649;
    --pine-green-hover: #134238;
    --pine-light: #eef6f4;
    --vermilion: #a8382b;
    --vermilion-light: #faecea;
    --shadow-soft: 0 10px 30px rgba(50, 42, 33, 0.06), 0 2px 6px rgba(50, 42, 33, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    background: var(--bg-page);
    background-image: radial-gradient(#e7dfce 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink-primary);
    min-height: 100vh;
    padding: 32px 16px 60px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    width: 100%;
    max-width: 660px;
    margin: 0 auto;
  }

  /* 主卡片容器 */
  .card {
    background: var(--paper-card);
    border: 1px solid var(--line-border);
    border-radius: 16px;
    box-shadow: var(--shadow-soft);
    padding: 32px 34px 40px;
    position: relative;
    overflow: hidden;
  }

  /* 古籍纹理边框线装饰 */
  .card::before {
    content: "";
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 1px solid rgba(212, 200, 178, 0.45);
    border-radius: 12px;
    pointer-events: none;
  }

  /* 顶部标题栏 */
  .header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--pine-green);
    background: var(--pine-light);
    border: 1px solid rgba(26, 86, 73, 0.2);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  h1 {
    font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink-primary);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--ink-muted);
    letter-spacing: 0.5px;
  }

  /* 表单布局 */
  .form-section {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    z-index: 1;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .field-label .label-tip {
    font-size: 11px;
    font-weight: normal;
    color: var(--ink-muted);
  }

  /* 输入控件 */
  input[type="text"], select {
    width: 100%;
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--line-border);
    border-radius: 9px;
    background: #ffffff;
    color: var(--ink-primary);
    outline: none;
    transition: all 0.2s ease;
  }

  input[type="text"]:focus, select:focus {
    border-color: var(--pine-green);
    box-shadow: 0 0 0 3px rgba(26, 86, 73, 0.1);
  }

  /* 灵感标签推荐池 */
  .tag-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .tag-chip {
    font-size: 12px;
    background: var(--paper-card-subtle);
    border: 1px solid var(--line-border);
    color: var(--ink-secondary);
    padding: 3px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .tag-chip:hover {
    background: #eee8db;
    border-color: var(--line-border-strong);
    color: var(--ink-primary);
  }

  .tag-chip.title-type {
    color: var(--pine-green);
    background: var(--pine-light);
    border-color: rgba(26, 86, 73, 0.25);
  }

  /* 模型选单 & 详细说明卡片 */
  .model-card-detail {
    background: var(--paper-card-subtle);
    border: 1px dashed var(--line-border-strong);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--ink-secondary);
    line-height: 1.6;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }

  .model-card-detail .icon {
    font-size: 16px;
  }

  /* 参数控制网格 */
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 500px) {
    .controls-grid { grid-template-columns: 1fr; }
    .card { padding: 24px 20px 30px; }
  }

  /* 温度滑块容器 */
  .temp-slider-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .temp-slider-wrap input[type="range"] {
    flex: 1;
    accent-color: var(--pine-green);
    cursor: pointer;
  }

  .temp-val-badge {
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
    min-width: 34px;
    text-align: right;
    color: var(--pine-green);
  }

  .temp-style-hint {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* 首数切换 Pills */
  .count-pills {
    display: flex;
    border: 1px solid var(--line-border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }

  .count-btn {
    flex: 1;
    text-align: center;
    padding: 7px 0;
    font-size: 13px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink-secondary);
    transition: all 0.15s ease;
  }

  .count-btn:not(:last-child) {
    border-right: 1px solid var(--line-border);
  }

  .count-btn.active {
    background: var(--pine-green);
    color: #fff;
    font-weight: 600;
  }

  /* 生成主按钮 */
  .btn-submit {
    margin-top: 8px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--pine-green), #14493e);
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26, 86, 73, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .btn-submit:hover:not(:disabled) {
    background: linear-gradient(135deg, #164a3e, #0f3930);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(26, 86, 73, 0.32);
  }

  .btn-submit:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
  }

  /* 正在生成加载提示 */
  .loading-box {
    display: none;
    text-align: center;
    padding: 24px 0;
    color: var(--ink-secondary);
  }

  .loading-box.active {
    display: block;
  }

  .ink-pulse {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 3px solid rgba(26, 86, 73, 0.2);
    border-top-color: var(--pine-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--ink-muted);
  }

  /* 诗歌输出展示区 */
  .results-area {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* 单首诗卡片 */
  .poem-card {
    background: #fffdf8;
    border: 1px solid var(--line-border);
    border-radius: 12px;
    padding: 22px 24px;
    position: relative;
    box-shadow: 0 2px 10px rgba(50, 42, 33, 0.03);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .poem-card:hover {
    box-shadow: 0 4px 16px rgba(50, 42, 33, 0.06);
  }

  /* 右上角朱砂印章 */
  .seal {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 36px;
    height: 36px;
    border: 2px solid var(--vermilion);
    border-radius: 6px;
    color: var(--vermilion);
    font-family: "Songti SC", "SimSun", "STSong", serif;
    font-size: 11px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(7deg);
    opacity: 0.85;
    user-select: none;
    pointer-events: none;
  }

  .poem-head {
    font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-primary);
    margin-bottom: 6px;
    text-align: center;
    padding: 0 44px;
    letter-spacing: 1.5px;
  }

  .poem-author {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .poem-divider {
    width: 90px;
    height: 1px;
    background: #e6dfce;
    margin: 0 auto 16px;
    position: relative;
  }

  .poem-divider::after {
    content: "◈";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fffdf8;
    padding: 0 6px;
    font-size: 9px;
    color: var(--vermilion);
  }

  /* 平水韵韵部标签（作者行高亮徽章） */
  .rhyme-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    color: var(--pine-green);
    background: var(--pine-light);
    border: 1px solid rgba(26, 86, 73, 0.28);
    border-radius: 10px;
    padding: 1px 9px;
    margin-left: 4px;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  /* 风格标签（角落小字：原预测作者名风格） */
  .style-tag {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    color: #877e71;
    border: 1px dashed rgba(160, 154, 142, 0.55);
    border-radius: 6px;
    padding: 1px 7px;
    margin-left: 4px;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }

  .poem-content {
    font-family: "STKaiti", "KaiTi", "Biaukai", "Songti SC", serif;
    font-size: 20px;
    line-height: 2.1;
    color: #1e1c1a;
    letter-spacing: 1.5px;
    margin: 16px 0 20px;
    text-align: center;
  }

  .couplet-line {
    white-space: nowrap;
    text-align: center;
  }

  /* 卡片底部操作按钮栏 */
  .card-actions {
    border-top: 1px dashed var(--line-border);
    padding-top: 12px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--line-border);
    background: var(--paper-card-subtle);
    color: var(--ink-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }

  .action-btn:hover {
    background: #f0e8da;
    border-color: var(--line-border-strong);
    color: var(--ink-primary);
  }

  .action-btn.active-recite {
    background: var(--pine-light);
    color: var(--pine-green);
    border-color: var(--pine-green);
  }

  /* 提示与错误信息 */
  .meta-summary {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 14px;
  }

  .error-banner {
    background: var(--vermilion-light);
    border: 1px solid rgba(168, 56, 43, 0.25);
    color: var(--vermilion);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
  }

  /* 吐司通知 (Toast) */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(38, 36, 33, 0.9);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 折叠历史记录 */
  .history-toggle-wrap {
    margin-top: 24px;
    text-align: center;
  }

  .history-toggle-btn {
    background: none;
    border: none;
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color 0.15s ease;
  }

  .history-toggle-btn:hover {
    color: var(--pine-green);
    background: var(--paper-card-subtle);
  }

  .history-section {
    display: none;
  }

  .history-item {
    font-size: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(230, 223, 206, 0.55);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .history-item:hover {
    background: var(--paper-card-subtle);
  }

  .history-item.active {
    background: var(--paper-card-subtle);
    box-shadow: inset 3px 0 0 var(--pine-green);
  }

  .history-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-border);
    background: var(--paper-card-subtle);
  }

  .history-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-secondary);
  }

  .history-close-btn {
    background: none;
    border: none;
    font-size: 16px;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s ease;
  }

  .history-close-btn:hover {
    color: var(--vermilion);
    background: var(--vermilion-light);
  }

  /* 移动端/窄屏：底部滑出面板 */
  @media (max-width: 979px) {
    .history-section {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 75vh;
      background: var(--paper-card);
      border-top: 1px solid var(--line-border-strong);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 30px rgba(50, 42, 33, 0.15);
      z-index: 100;
      overflow-y: auto;
    }
    .history-section.open {
      display: block;
      animation: slideUp 0.25s ease forwards;
    }
  }

  /* 桌面宽屏：右侧悬浮侧边栏滑出，主容器始终居中 */
  @media (min-width: 980px) {
    .container {
      margin: 0 auto;
    }
    .history-section {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 330px;
      background: var(--paper-card);
      border-left: 1px solid var(--line-border);
      box-shadow: -6px 0 25px rgba(50, 42, 33, 0.08);
      z-index: 100;
      overflow-y: auto;
    }
    .history-section.open {
      display: block;
      animation: slideRightIn 0.25s ease forwards;
    }
  }

  @keyframes slideRightIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <!-- 顶栏标题 -->
    <div class="header">
      <div class="header-badge">
        <span>✦</span> 迷你 GPT 诗词引擎
      </div>
      <h1>砚墨成诗</h1>
      <div class="subtitle">轻量自回归语言模型 · 古风古典格律自动生成</div>
    </div>

    <!-- 交互配置表单 -->
    <div class="form-section">
      <!-- 1. 开头/命题输入 -->
      <div class="field-group">
        <div class="field-label">
          <span>灵感命题 / 诗歌开头</span>
          <span class="label-tip">支持意向词或《标题》</span>
        </div>
        <input type="text" id="seed" value="秋思" placeholder="如：秋思（意境） / 《山高水流》（标题）" maxlength="20">
        
        <!-- 灵感词快速选填 -->
        <div class="tag-container">
          <span class="tag-chip" onclick="pickTag('秋思')">秋思</span>
          <span class="tag-chip" onclick="pickTag('孤舟')">孤舟</span>
          <span class="tag-chip" onclick="pickTag('咏梅')">咏梅</span>
          <span class="tag-chip" onclick="pickTag('听雨')">听雨</span>
          <span class="tag-chip" onclick="pickTag('登高')">登高</span>
          <span class="tag-chip" onclick="pickTag('夜泊')">夜泊</span>
          <span class="tag-chip title-type" onclick="pickTag('《春日》')">《春日》</span>
          <span class="tag-chip title-type" onclick="pickTag('《山高水流》')">《山高水流》</span>
          <span class="tag-chip title-type" onclick="pickTag('《临江仙》')">《临江仙》</span>
        </div>
      </div>

      <!-- 2. 模型选择 -->
      <div class="field-group">
        <div class="field-label">
          <span>推理模型</span>
          <span class="label-tip" id="model-badge">12,816 词元 · 245万参数</span>
        </div>
        <select id="model" onchange="onModelChange()">
          <option value="wuyan_bpe_v3_sft" selected>五言BPE v3·SFT（唐风微调 · 当前最强）</option>
          <option value="wuyan_bpe_v3">五言BPE v3（全新架构 · 严格五言）</option>
          <option value="wuyan_bpe">五言BPE v2（BPE分词 · 上一代）</option>
          <option value="jueju">五言绝句（格式最严整 · 1.7万首专训）</option>
          <option value="all">通用模型（33万首全语料 · 体裁广泛）</option>
        </select>
        <div class="model-card-detail" id="model-desc">
          <span class="icon">📜</span>
          <span id="model-desc-text">9.2万首严格五言预训练 + 3,125首李杜王孟名篇SFT · 当前最强</span>
        </div>
      </div>

      <!-- 3. 双列参数调节：温度与首数 -->
      <div class="controls-grid">
        <!-- 采样温度 -->
        <div class="field-group">
          <div class="field-label">
            <span>采样温度</span>
            <span class="temp-val-badge" id="temp-val">0.6</span>
          </div>
          <div class="temp-slider-wrap">
            <input type="range" id="temp" min="0.2" max="1.5" step="0.05" value="0.6" oninput="onTempChange()">
          </div>
          <div class="temp-style-hint" id="temp-hint">黄金平衡（推荐，韵味自然）</div>
        </div>

        <!-- 生成首数 -->
        <div class="field-group">
          <div class="field-label">
            <span>生成首数</span>
            <span class="label-tip">批量采样对比</span>
          </div>
          <div class="count-pills">
            <button type="button" class="count-btn" onclick="setN(1)">1首</button>
            <button type="button" class="count-btn" onclick="setN(2)">2首</button>
            <button type="button" class="count-btn active" onclick="setN(3)">3首</button>
            <button type="button" class="count-btn" onclick="setN(4)">4首</button>
          </div>
        </div>
      </div>

      <!-- 生成触发按钮 -->
      <button class="btn-submit" id="btn-submit" onclick="generatePoems()">
        <span>✦</span> 研墨成诗
      </button>

      <!-- 错误提示 -->
      <div class="error-banner" id="error-banner"></div>
    </div>

    <!-- 加载中动画 -->
    <div class="loading-box" id="loading-box">
      <div class="ink-pulse"></div>
      <div class="loading-text" id="loading-text">正在推演平仄韵律，请稍候...</div>
    </div>

    <!-- 结果展示区 -->
    <div class="results-area" id="results-area"></div>
    <div class="meta-summary" id="meta-summary"></div>

    <!-- 历史生成记录切换按钮 -->
    <div class="history-toggle-wrap">
      <button class="history-toggle-btn" onclick="toggleHistory()">
        <span id="history-arrow">▶</span> 生成记录·本地保存 (<span id="history-count">0</span>)
      </button>

// ---------- 诗歌解析器 ----------
function parsePoemBlock(rawText) {
  const lines = rawText.trim().split("\n").map(l => l.trim()).filter(Boolean);
  let title = "《无题》";
  let author = "无名氏";
  let rhymeTag = "";
  let verses = [];

  let startIdx = 0;
  if (lines.length > 0 && (lines[0].startsWith("《") || lines[0].includes("》"))) {
    title = lines[0];
    startIdx = 1;
    if (lines.length > 1 && (lines[1].length <= 24 || lines[1].includes("〔押")) && !lines[1].includes("，") && !lines[1].includes("。")) {
      // 兼容带平水韵标签与风格标签的作者行：如 "佚名（刘禹锡风格）  〔押七尤〕"
      const m = lines[1].match(/〔押(.+?)〕/);
      if (m) {
        rhymeTag = m[1].trim();
        author = lines[1].replace(/〔押.+?〕/g, "").trim() || "无名氏";
      } else {
        author = lines[1];
      }
      startIdx = 2;
    }
  }

  // 提取风格标签：作者行里的"（X风格）" → 角落小字标签，作者主体显示"佚名"
  let styleTag = "";
  const sm = author.match(/（(.+?)风格）$/);
  if (sm) {
    styleTag = sm[1];
    author = author.replace(/（.+?风格）$/, "").trim() || "无名氏";
  }

  verses = lines.slice(startIdx);
  if (verses.length === 0 && lines.length > 0) {
    verses = lines;
  }

  // 智能规整分行：若正文未分行或单行包含多个逗号句号，自动按标点（，。！？；）切分为标准诗句
  let formattedVerses = [];
  verses.forEach(v => {
    const segs = v.match(/[^，。！？；\n]+[，。！？；]?/g);
    if (segs && segs.length > 1) {
      formattedVerses.push(...segs.map(s => s.trim()).filter(Boolean));
    } else if (v.trim()) {
      formattedVerses.push(v.trim());
    }
  });
  if (formattedVerses.length > 0) {
    verses = formattedVerses;
  }

  return { title, author, styleTag, rhymeTag, verses: verses.join("\n"), raw: rawText };
}

// ---------- 核心生成请求 ----------
async function generatePoems() {
  const btn = document.getElementById("btn-submit");
  const errBox = document.getElementById("error-banner");
  const loadingBox = document.getElementById("loading-box");
  const resultsArea = document.getElementById("results-area");
  const metaSummary = document.getElementById("meta-summary");
  const seedInput = document.getElementById("seed");

  const seed = seedInput.value.trim() || "秋思";
  const temp = parseFloat(document.getElementById("temp").value) || 0.6;
  const modelId = document.getElementById("model").value;

  btn.disabled = true;
  errBox.style.display = "none";
  loadingBox.classList.add("active");
  resultsArea.innerHTML = "";
  metaSummary.textContent = "";

  // 动态加载提示语轮播
  const loadingTexts = [
    "正在推演平仄韵律...",
    "自回归采样生成中...",
    "研墨挥毫，意象缀连...",
    "斟酌字句章法..."
  ];
  let textIdx = 0;
  const timer = setInterval(() => {
    textIdx = (textIdx + 1) % loadingTexts.length;
    document.getElementById("loading-text").textContent = loadingTexts[textIdx];
  }, 1200);

  const startTime = Date.now();

  try {
    const res = await fetch("/api/poem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        seed: seed,
        temperature: temp,
        n: currentN,
        model: modelId
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "生成服务响应异常");

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    const poems = (data.poems || []).map(parsePoemBlock);

    if (poems.length === 0) {
      resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--ink-muted);">
        未能切出合规诗篇，建议更换开头意象或微调温度重试。
      </div>`;
      return;
    }

    // 渲染诗歌卡片（生成结果 / 历史切换共用）
    renderPoemCards(poems);

    metaSummary.textContent = `${data.model_name || modelId} · 温度 ${data.temperature} · 耗时 ${elapsed}s · 共 ${poems.length} 首`;

    // 记录到本地历史（localStorage 持久化）
    poems.forEach(p => {
      historyRecords.unshift({
        title: p.title,
        author: p.author,
        styleTag: p.styleTag || "",
        rhymeTag: p.rhymeTag || "",
        verses: p.verses,
        seed: seed,
        model: data.model_name || modelId,
        time: new Date().toLocaleTimeString()
      });
    });
    if (historyRecords.length > 60) historyRecords = historyRecords.slice(0, 60);
    persistHistory();
    updateHistoryUI();

    // 缓存到全局以便操作
    window._CURRENT_POEMS = poems;

  } catch (err) {
    errBox.textContent = "生成失败: " + err.message;
    errBox.style.display = "block";
  } finally {
    clearInterval(timer);
    loadingBox.classList.remove("active");
    btn.disabled = false;
  }
}

// ---------- 实用功能：一键复制 ----------
function copyPoem(idx) {
  const p = window._CURRENT_POEMS[idx];
  if (!p) return;
  const authorLine = p.author + (p.styleTag ? "（" + p.styleTag + "风格）" : "") + (p.rhymeTag ? "  〔押" + p.rhymeTag + "〕" : "");
  const fullText = `${p.title}\n${authorLine}\n\n${p.verses}\n\n—— 迷你GPT·砚墨成诗`;
  navigator.clipboard.writeText(fullText).then(() => {
    showToast("✓ 诗文已复制到剪贴板");
  }).catch(() => {
    // 兼容方案
    const area = document.createElement("textarea");
    area.value = fullText;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    document.body.removeChild(area);
    showToast("✓ 诗文已复制");
  });
}

// ---------- 实用功能：语音吟诵 (SpeechSynthesis) ----------
function recitePoem(idx) {
  const p = window._CURRENT_POEMS[idx];
  if (!p || !('speechSynthesis' in window)) {
    showToast("当前浏览器不支持语音吟诵");
    return;
  }

  const iconEl = document.getElementById(`recite-icon-${idx}`);

  if (speechSynthesis.speaking && recitingIndex === idx) {
    speechSynthesis.cancel();
    recitingIndex = null;
    if (iconEl) iconEl.textContent = "🔊";
    return;
  }

  speechSynthesis.cancel();
  if (recitingIndex !== null) {
    const prev = document.getElementById(`recite-icon-${recitingIndex}`);
    if (prev) prev.textContent = "🔊";
  }

  recitingIndex = idx;
  if (iconEl) iconEl.textContent = "⏹";

  // 格式化朗读文本，增加诗词朗读停顿
  const speechText = `${p.title}。${p.author}${p.styleTag ? "（" + p.styleTag + "风格）" : ""}。${p.verses.replace(/\n/g, "，")}`;
  const utterance = new SpeechSynthesisUtterance(speechText);
  utterance.lang = "zh-CN";
  utterance.rate = 0.82; // 稍慢节奏更有古意
  utterance.pitch = 1.0;

  utterance.onend = () => {
    recitingIndex = null;
    if (iconEl) iconEl.textContent = "🔊";
  };
  utterance.onerror = () => {
    recitingIndex = null;
    if (iconEl) iconEl.textContent = "🔊";
  };

  speechSynthesis.speak(utterance);
}

// ---------- 实用功能：Canvas 宣纸风精致诗卡导出（复刻用户喜爱原版风格） ----------
function exportPoemCard(idx) {
  const p = window._CURRENT_POEMS[idx];
  if (!p) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  // 1. 数据整理与对联分行（每联一行：上联，  下联。）
  let segs = [];
  const rawLines = (p.verses || "").split("\n").map(l => l.trim()).filter(Boolean);
  rawLines.forEach(ln => {
    const matched = ln.match(/[^，。！？；\n]+[，。！？；]?/g);
    if (matched && matched.length > 0) {
      segs.push(...matched.map(s => s.trim()).filter(Boolean));
    } else if (ln.trim()) {
      segs.push(ln.trim());
    }
  });
  if (segs.length === 0 && p.verses) {
    const matched = p.verses.match(/[^，。！？；\n]+[，。！？；]?/g);
    segs = matched ? matched.map(s => s.trim()).filter(Boolean) : [p.verses.trim()];
  }

  const coupletLines = [];
  for (let i = 0; i < segs.length; i += 2) {
    if (i + 1 < segs.length) {
      coupletLines.push(`${segs[i]}  ${segs[i + 1]}`);
    } else {
      coupletLines.push(segs[i]);
    }
  }

  // 2. 比例与自适应高度（与用户参考原图 872x1024 / 436x512 保持完全一致）
  const width = 436;
  const isShort = coupletLines.length <= 2;
  const height = isShort ? 440 : 512;

  // 3. 超采样 2x 视网膜高清分辨率 (872 x 1024)
  const dpr = 2;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);

  // 4. 绘制宣纸复古微渐变底色
  const grad = ctx.createLinearGradient(0, 0, width, height);
  grad.addColorStop(0, "#FBF8F1");
  grad.addColorStop(1, "#F4ECE1");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // 5. 绘制典雅双重内边框与四角回纹折线
  const m1 = 16;
  ctx.strokeStyle = "#D9CEBA";
  ctx.lineWidth = 1.8;
  ctx.strokeRect(m1, m1, width - m1 * 2, height - m1 * 2);

  const m2 = 22;
  ctx.strokeStyle = "#E8E0D2";
  ctx.lineWidth = 1;
  ctx.strokeRect(m2, m2, width - m2 * 2, height - m2 * 2);

  const cw = 6;
  ctx.strokeStyle = "#C7BBA6";
  ctx.lineWidth = 1;
  [
    [m2, m2, 1, 1],
    [width - m2, m2, -1, 1],
    [m2, height - m2, 1, -1],
    [width - m2, height - m2, -1, -1]
  ].forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy * cw);
    ctx.lineTo(cx + dx * cw, cy + dy * cw);
    ctx.lineTo(cx + dx * cw, cy);
    ctx.stroke();
  });

  // 6. 诗歌标题 (宋体粗体居中)
  ctx.fillStyle = "#262421";
  ctx.font = "bold 22px 'Songti SC', 'SimSun', 'STSong', serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(p.title, width / 2, 65);

  // 7. 作者行 (灰褐淡雅居中)
  let authorStr = "◈ " + p.author;
  if (p.styleTag) authorStr += `（${p.styleTag}风格）`;
  if (p.rhymeTag) authorStr += `  〔押${p.rhymeTag}〕`;
  ctx.fillStyle = "#7E7567";
  ctx.font = "13px 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(authorStr, width / 2, 98);

  // 8. 简约装饰横线
  ctx.strokeStyle = "#E4DAC8";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(width / 2 - 38, 118);
  ctx.lineTo(width / 2 + 38, 118);
  ctx.stroke();

  // 9. 诗词正文 (楷体居中整饬，一联一行，疏密有致)
  const lineH = 38;
  const startY = isShort ? 160 : 155;
  ctx.fillStyle = "#1E1C1A";
  ctx.font = "20px 'STKaiti', 'KaiTi', 'Songti SC', serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  coupletLines.forEach((line, idx) => {
    const yPos = startY + idx * lineH + lineH / 2;
    ctx.fillText(line, width / 2, yPos);
  });

  // 10. 右下角朱砂红印章「墨韵雅成」 (经典压角章位置)
  const sealW = 42;
  const sealX = width - 76;
  const sealY = height - 96;

  ctx.strokeStyle = "#A8382B";
  ctx.lineWidth = 1.8;
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(sealX, sealY, sealW, sealW, 2);
    ctx.stroke();
  } else {
    ctx.strokeRect(sealX, sealY, sealW, sealW);
  }

  ctx.fillStyle = "#A8382B";
  ctx.font = "bold 12px 'Songti SC', 'SimSun', serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const sHalf = sealW / 2;
  ctx.fillText("墨", sealX + sHalf * 0.5, sealY + sHalf * 0.5);
  ctx.fillText("韵", sealX + sHalf * 1.5, sealY + sHalf * 0.5);
  ctx.fillText("雅", sealX + sHalf * 0.5, sealY + sHalf * 1.5);
  ctx.fillText("成", sealX + sHalf * 1.5, sealY + sHalf * 1.5);

  // 11. 底部小字落款 (左下角)
  ctx.fillStyle = "#A39A8C";
  ctx.font = "10px 'PingFang SC', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("迷你GPT写诗小模型 · 生成留念", 32, height - 34);

  // 12. 触发下载
  const link = document.createElement("a");
  const safeTitle = p.title.replace(/[《》\s]/g, "") || "诗词";
  link.download = `${safeTitle}_诗卡.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();

  showToast("✓ 诗词精美图卡已导出");
}

// ---------- 辅助：将正文格式化为对仗整联 HTML（每联一行，两半句自然隔空居中） ----------
function formatVersesHTML(versesStr) {
  let segs = [];
  const rawLines = (versesStr || "").split("\n").map(l => l.trim()).filter(Boolean);
  rawLines.forEach(ln => {
    const matched = ln.match(/[^，。！？；\n]+[，。！？；]?/g);
    if (matched && matched.length > 0) {
      segs.push(...matched.map(s => s.trim()).filter(Boolean));
    } else if (ln.trim()) {
      segs.push(ln.trim());
    }
  });
  if (segs.length === 0 && versesStr) {
    const matched = versesStr.match(/[^，。！？；\n]+[，。！？；]?/g);
    segs = matched ? matched.map(s => s.trim()).filter(Boolean) : [versesStr.trim()];
  }

  const coupletLines = [];
  for (let i = 0; i < segs.length; i += 2) {
    if (i + 1 < segs.length) {
      coupletLines.push(`${escapeHtml(segs[i])}&emsp;${escapeHtml(segs[i + 1])}`);
    } else {
      coupletLines.push(escapeHtml(segs[i]));
    }
  }

  return coupletLines.map(line => `<div class="couplet-line">${line}</div>`).join("");
}

// ---------- 诗歌渲染（生成 / 历史切换共用） ----------
function renderPoemCards(poems) {
  const resultsArea = document.getElementById("results-area");
  window._CURRENT_POEMS = poems;
  resultsArea.innerHTML = poems.map((p, idx) => `
    <div class="poem-card" id="poem-card-${idx}">
      <div class="seal">墨韵<br>雅成</div>
      <div class="poem-head">${escapeHtml(p.title)}</div>
      <div class="poem-author">
        <span>◈ ${escapeHtml(p.author)}</span>
        ${p.styleTag ? `<span class="style-tag">${escapeHtml(p.styleTag)}风格</span>` : ""}
        ${p.rhymeTag ? `<span class="rhyme-badge">押${escapeHtml(p.rhymeTag)}</span>` : ""}
      </div>
      <div class="poem-divider"></div>
      <div class="poem-content">${formatVersesHTML(p.verses)}</div>
      <div class="card-actions">
        <button class="action-btn" onclick="copyPoem(${idx})">
          <span>📋</span> 复制
        </button>
        <button class="action-btn" onclick="recitePoem(${idx})">
          <span id="recite-icon-${idx}">🔊</span> 吟诵
        </button>
        <button class="action-btn" onclick="exportPoemCard(${idx})">
          <span>🖼️</span> 导出诗卡
        </button>
      </div>
    </div>
  `).join("");
}

// ---------- 历史记录交互（侧边栏切换 + 本地持久化） ----------
const HISTORY_KEY = "poem_history_v1";

function persistHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(historyRecords));
  } catch (e) { /* 存储满等异常忽略 */ }
}

function toggleHistory() {
  const section = document.getElementById("history-section");
  const arrow = document.getElementById("history-arrow");
  const isOpen = section.classList.toggle("open");
  if (arrow) arrow.textContent = isOpen ? "▼" : "▶";
  try { localStorage.setItem("poem_history_open", isOpen ? "1" : "0"); } catch (e) {}
}

function updateHistoryUI() {
  const countEl = document.getElementById("history-count");
  if (countEl) countEl.textContent = historyRecords.length;
  const headCountEl = document.getElementById("history-header-count");
  if (headCountEl) headCountEl.textContent = historyRecords.length;
  const list = document.getElementById("history-list");
  list.innerHTML = historyRecords.slice(0, 20).map((r, i) => `
    <div class="history-item" id="history-item-${i}" onclick="showHistoryPoem(${i})">
      <span><strong>${escapeHtml(r.title)}</strong> · ${escapeHtml(r.author)}${r.styleTag ? ` <em style="color:#a09a8e;font-style:normal;font-size:10px;">${escapeHtml(r.styleTag)}风格</em>` : ""}${r.rhymeTag ? ` <em style="color:var(--pine-green);font-style:normal;font-size:10px;">〔押${escapeHtml(r.rhymeTag)}〕</em>` : ""}（${escapeHtml(r.seed)}）</span>
      <span style="font-size:11px; color:#a09a8e;">${r.time}</span>
    </div>
  `).join("");
  // 高亮当前切换项
  const cur = document.querySelectorAll(".history-item");
  cur.forEach(el => el.classList.remove("active"));
  if (window._HISTORY_ACTIVE != null) {
    const el = document.getElementById("history-item-" + window._HISTORY_ACTIVE);
    if (el) el.classList.add("active");
  }
}

/** 点击侧边栏历史记录 → 切换显示该诗 */
function showHistoryPoem(i) {
  const r = historyRecords[i];
  if (!r) return;
  const poem = {
    title: r.title, author: r.author, styleTag: r.styleTag || "",
    rhymeTag: r.rhymeTag || "", verses: r.verses
  };
  renderPoemCards([poem]);
  const meta = document.getElementById("meta-summary");
  meta.textContent = `📜 历史记录 · ${r.model || ""} · 开头「${r.seed}」 · ${r.time}`;
  window._HISTORY_ACTIVE = i;
  updateHistoryUI();
  document.getElementById("results-area").scrollIntoView({ behavior: "smooth", block: "start" });
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// 页面加载就绪
window.addEventListener("DOMContentLoaded", () => {
  // 恢复本地历史记录（localStorage）
  try {
    const saved = localStorage.getItem(HISTORY_KEY);
    if (saved) {
      const arr = JSON.parse(saved);
      if (Array.isArray(arr)) historyRecords = arr;
    }
    if (localStorage.getItem("poem_history_open") === "1") {
      document.getElementById("history-section").classList.add("open");
      document.getElementById("history-arrow").textContent = "▼";
    }
  } catch (e) {}
  updateHistoryUI();
  initModels();
  onTempChange();
});
</script>
