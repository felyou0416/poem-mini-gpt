name: Android CI - Build and Release Poetry AI APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '安卓APP/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '安卓APP/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Poetry AI APK (Single Model v3 SFT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Inspect and Verify Single Model in Assets
        run: |
          echo "=========================================="
          echo "=== 检查 assets 目录模型配置 ==="
          echo "=========================================="
          ASSETS_DIR="安卓APP/app/src/main/assets"
          ls -lh "$ASSETS_DIR"

          # 确保仅打包单一目标模型 model.bin，杜绝多模型膨胀
          BIN_COUNT=$(find "$ASSETS_DIR" -maxdepth 1 -name "*.bin" | wc -l)
          echo "检测到模型 bin 文件数量: $BIN_COUNT"
          if [ "$BIN_COUNT" -ne 1 ]; then
            echo "::error::assets 目录中必须且仅能存在 1 个 model.bin 模型文件！当前检测到 $BIN_COUNT 个。"
            exit 1
          fi

          PT_COUNT=$(find "$ASSETS_DIR" -maxdepth 1 -name "*.pt" | wc -l)
          if [ "$PT_COUNT" -ne 0 ]; then
            echo "::error::assets 目录中严禁放入原始 PyTorch .pt 权重！当前检测到 $PT_COUNT 个。"
            exit 1
          fi

          MODEL_SIZE=$(stat -c%s "$ASSETS_DIR/model.bin" 2>/dev/null || stat -f%z "$ASSETS_DIR/model.bin")
          echo "单一模型 model.bin 大小: $MODEL_SIZE 字节 (~17.3MB)"
          echo "模型校验通过：仅打包'五言BPE v3·SFT'单一离线推理模型。"

      - name: Build Debug APK
        working-directory: ./安卓APP
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release_apk
          cp "安卓APP/app/build/outputs/apk/debug/app-debug.apk" "release_apk/poem.apk"
          echo "=== 构建产物清单 ==="
          ls -lh release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poem-apk
          path: release_apk/poem.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "poem v1.0.1 (安卓客户端 · 砚墨成诗)"
          files: release_apk/poem.apk
          body: |
            ## poem · 安卓端离线诗词生成器 (v1.0.1)

            本安装包由 GitHub Actions 云端流水线构建，支持完全离线运行。

            ### 📦 模型与应用规格
            - **App 名称**: `poem`
            - **核心模型**: 五言BPE v3·SFT 旗舰版（344万参数，6层/192维/6头 RoPE + RMSNorm）
            - **视觉设计**: 1:1 复刻国风 Web 前端，宣纸底色 + 朱砂红“墨韵雅成”印章 + 黛绿平水韵徽章
            - **交互控制**: 实时采样温度滑块 (0.2~1.5) + 生成首数胶囊选择 + 意象标签池
            - **实用功能**: 📋一键复制 + 🔊原生语音古风吟诵 + 📤系统一键分享
            - **安装包体积**: ~20.5MB（严格单一模型打包）
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
